# The catalog reaches a product, and the product can be favourited.
appId: ${APP_ID}
env:
  # The dev build unless the run says otherwise — see config.yaml.
  APP_ID: ${APP_ID || "com.example.androidproject1.dev"}
name: Browse the catalog to a product
---
- runFlow: sign-in.yaml

- tapOn:
    id: "CategoriesScreen"
    optional: true
- tapOn:
    id: "tabs_catalogTab"
- assertVisible:
    id: "CategoriesScreen"
- tapOn: "Beverages"
- assertVisible:
    id: "ProductsScreen"
- tapOn: "Coffee"
- assertVisible:
    id: "ProductDetailScreen"

# The heart is an icon, so its contentDescription is its id — which is why accessibility here is
# a by-product of being testable rather than separate work.
- tapOn:
    id: "productDetail_favouriteButton"
- tapOn:
    id: "tabs_homeTab"
- assertVisible:
    id: "home_favouritesList"
