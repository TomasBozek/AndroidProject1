# Signing out returns to the auth flow, which has no tabs.
appId: com.example.androidproject1.dev
name: Log out returns to Login
---
- runFlow: sign-in.yaml

- tapOn:

    id: "tabs_settingsTab"
- assertVisible:
    id: "SettingsScreen"
- tapOn:
    id: "settings_logoutButton"

# Confirm-then-act, so the dialog is the point rather than something to tap through. By id, not by
# text: the screen's own button says "Log out" too, and matching on the word taps the wrong one.
- assertVisible:
    id: "alert_dialog"
- tapOn:
    id: "alert_confirmButton"

- assertVisible:
    id: "LoginScreen"
