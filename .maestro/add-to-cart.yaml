# The cart round trip: add from a product, see the badge, check out behind a confirmation.
appId: ${APP_ID}
env:
  # The dev build unless the run says otherwise — see config.yaml.
  APP_ID: ${APP_ID || "com.example.androidproject1.dev"}
name: Add a product to the cart and check out
---
- runFlow: sign-in.yaml

- tapOn:

    id: "tabs_catalogTab"
- tapOn: "Beverages"
- tapOn: "Coffee"
- tapOn:
    id: "productDetail_addToCartButton"

- tapOn:

    id: "tabs_cartTab"
- assertVisible:
    id: "cart_itemList"
# The count is a plural, so this is also the assertion that the right form was picked.
- assertVisible: "1 item"

- tapOn:
    id: "cart_checkoutButton"
# An order is not something to do on one tap.
- assertVisible: "Place this order?"
- tapOn: "Order"
- assertVisible:
    id: "cart_empty"
