// Types the Compose compiler cannot infer for itself, and this project's promise about each.
//
// Read with `./gradlew assembleDevDebug -PcomposeMetrics` — see `configureComposeCompiler` in
// build-logic/src/main/kotlin/AndroidConventions.kt. A type listed here is treated as stable
// wherever it appears, so a line is a promise: its public properties do not change after
// construction. Adding one to silence a report that is telling the truth turns a recomposition
// bug into an invisible one.
//
// `*` matches one package segment, `**` any number.

// Read-only collections. `List`, `Set` and `Map` are interfaces, so the compiler has to assume the
// instance behind one might be mutable. Nothing here hands a mutable collection to a state: an
// `XState` is `@Immutable` and is rebuilt with `copy(...)` rather than edited in place, and a
// repository returns what it built. This is the entry that makes `List<Product>` in a state stable.
kotlin.collections.*

// The domain models. A `domain` module is Kotlin/JVM, so the Compose compiler never runs over it
// and treats every class it produces as unstable — not "unknown", unstable — however plain the
// data class is. They are `data class`es of primitives and other domain models by the layer's own
// rule, so this states what the compiler would infer if it could see them.
com.example.androidproject1.feature.*.domain.**
