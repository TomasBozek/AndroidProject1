# The API level Robolectric runs every unit test at, for every module at once.
#
# Robolectric ships one SDK image per API level and has none for this project's targetSdk, so a
# test that asked for the target would fail to start. This is the newest it does have.
#
# This directory is added to every module's `test` resources by `configureRobolectricSdk` in
# build-logic, so raising the pin is this one line. It used to be `private const val
# ROBOLECTRIC_SDK` and the paragraph explaining it, in each of 51 test files.
#
# A test that genuinely needs a different level still says so: `@Config(sdk = [...])` on the class
# wins over this file.
sdk=35
