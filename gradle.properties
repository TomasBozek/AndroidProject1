# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Build the modules that do not depend on each other at the same time. With this many small
# modules that is most of them.
org.gradle.parallel=true
# Reuse task outputs across builds and between clean builds.
org.gradle.caching=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# The base package. The convention plugins in build-logic/ derive every module's Android
# namespace from it and the project path, so this is the only place it is written down.
# scripts/init_project.py rewrites it.
basePackage=com.example.androidproject1
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Compose Preview Screenshot Testing (4.1). Must be here rather than in the convention plugin:
# the plugin reads it while it is being applied, before a module's own configuration runs.
android.experimental.enableScreenshotTest=true
