name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Weekly, so a release-only regression is found by the schedule rather than by a release.
    - cron: '0 6 * * 1'
  # For the maestro job: an emulator run before a release, on demand, without waiting for Monday.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    # Runs alongside the conventions job and is just as fast. A committed key is the one mistake
    # that a later commit cannot undo — it has to be caught on the pull request that adds it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the diff, so it needs more than the default depth.
          fetch-depth: 0

      # The binary rather than gitleaks-action: the action requires a paid licence key for
      # organization-owned repositories, which a template should not quietly depend on.
      - name: Scan for committed secrets
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner

  conventions:
    # Runs first and is fast: doctor.py checks the rules no compiler enforces, and exits non-zero
    # specifically so it can gate here. A convention violation fails before the slow build starts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check architectural conventions
        run: python3 scripts/doctor.py

      - name: Test the scaffolding scripts
        run: python3 scripts/test_scripts.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must match gradle/gradle-daemon-jvm.properties, which pins the daemon's JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # Before the build: it is fast, and a style failure should not wait on R8.
      - name: Check formatting
        run: ./gradlew ktlintCheck

      - name: Build, lint and test
        run: ./gradlew build

      # A signal, not a gate: no threshold, and it never fails the job. `build` has already run
      # the tests, so this only assembles the report.
      - name: Coverage report
        if: always()
        run: ./gradlew koverHtmlReport koverXmlReport

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/ktlint/**
            **/build/reports/tests/**
            build/reports/kover/**
          if-no-files-found: ignore

  release:
    # R8 is on for release, but `build` only assembles debug — a keep rule that goes missing shows
    # up when someone cuts a release, which is the worst time to find it. Tags and a weekly run
    # keep that surface honest without slowing every pull request down.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      # Creating the release for the tag. Stated here rather than left to the repository default,
      # which is read-only on a new repository and would fail the last step of a release.
      contents: write
    env:
      # At job level, so the guard on the keystore step can read it — a step's own `env` is not
      # available to its own `if`.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and its tags: `versionCode` is `git rev-list --count HEAD`, which on
          # the default shallow clone is 1 — the very number this stopped being. See ProjectConfig.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # Absent on a fork or a pull request, and that is fine: the build falls back to the debug
      # key and still assembles, which is what 5.2 is for.
      - name: Write the release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          cat > keystore.properties <<PROPERTIES
          storeFile=$PWD/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPERTIES

      - name: Assemble and lint the release build
        run: ./gradlew assembleProdRelease lintProdRelease

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: prod-release
          path: app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error

      # Only on a tag: the weekly run of this job exists to keep R8 honest, not to publish. The
      # notes are generated from the commits since the previous tag, which is why a commit is
      # named `<id> <title>` — the release page is the commit log, read by someone who was not
      # here for it. Re-running the job replaces the APK rather than failing on the release that
      # the first run already created.
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" app/build/outputs/apk/prod/release/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/prod/release/*.apk \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

  generators:
    # `test_scripts.py` checks the text a generator wrote; this compiles it. Text can be correct
    # and still not compile — an import the template stopped needing, a `:core:ui` signature that
    # moved — and nobody finds out until they run a generator on a Monday and get a red project.
    # Weekly rather than per-pull-request: it is minutes of Gradle to catch a rare regression, and
    # the ordinary build already compiles `feature/template` itself.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Must match gradle/gradle-daemon-jvm.properties, which pins the daemon's JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile what the generators write
        run: python3 scripts/test_scripts.py --with-gradle

  maestro:
    # An emulator boot plus five flows is minutes, not seconds, and the flows cover golden paths
    # rather than each change — so this runs weekly and on demand (D30), not on every pull request.
    # The schedule finds a broken path within a week; the dispatch is what you run before a release.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # An emulator that fails to boot otherwise hangs until the workflow's own six-hour limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Must match gradle/gradle-daemon-jvm.properties, which pins the daemon's JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # Built before the emulator starts, so a compile failure does not pay for a boot first.
      # `dev` serves the catalog from JSON fixtures (D20), which is what .maestro/config.yaml
      # names as its appId — a flow asserts the app, never the weather at a server.
      - name: Assemble the dev debug build
        run: ./gradlew :app:assembleDevDebug

      # The vendor's install script. `brew install maestro` gives the desktop app with no
      # `maestro test`, and there is no first-party action.
      - name: Install the Maestro CLI
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Without this the emulator falls back to software rendering and the flows time out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Third-party and build-only, so D27 lets it in: it never reaches the release APK, and
      # there is no first-party action that boots an emulator.
      - name: Run the flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # An emulator that draws nothing is faster and boots more reliably on a CI runner;
          # Maestro drives it over adb and needs no window.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/dev/debug/app-dev-debug.apk
            maestro test .maestro --debug-output maestro-debug

      # The recordings and the view hierarchy Maestro dumps on a failed assertion — which is the
      # only thing that says *why* an id was not found on a machine nobody can look at.
      - name: Upload the Maestro output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: maestro-debug/**
          if-no-files-found: ignore
